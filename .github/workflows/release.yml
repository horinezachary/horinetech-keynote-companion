name: Release

# Push a tag such as v0.1.0 to build, sign with Developer ID, notarize, and publish a GitHub release.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    env:
      APP: build/Keynote Companion.app
    steps:
      - uses: actions/checkout@v5

      - name: Test
        run: swift test

      - name: Import signing certificate
        env:
          CERT_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      - name: Build and sign
        env:
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}" UNIVERSAL=1 scripts/build-app.sh
          codesign --verify --strict --verbose=2 "$APP"

      - name: Notarize and staple
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          echo "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --wait
          rm "$RUNNER_TEMP/notary.p8"
          xcrun stapler staple "$APP"
          spctl --assess --type execute --verbose "$APP"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ZIP="Keynote-Companion-${GITHUB_REF_NAME}.zip"
          ditto -c -k --keepParent "$APP" "$ZIP"
          gh release create "$GITHUB_REF_NAME" "$ZIP" --title "Keynote Companion ${GITHUB_REF_NAME}" --generate-notes
