name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - name: Test
        run: swift test
      - name: Build app bundle
        run: UNIVERSAL=1 scripts/build-app.sh
      - uses: actions/upload-artifact@v5
        with:
          name: Keynote-Companion-app
          path: build/Keynote Companion.app
